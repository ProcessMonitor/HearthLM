[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hearthlm"
version = "0.1.0"
description = "A small decoder-only language model with a complete, readable training stack"
requires-python = ">=3.9"
dependencies = ["torch>=2.1", "numpy>=1.24", "tokenizers>=0.15"]

[project.optional-dependencies]
dev = ["pytest>=7", "safetensors>=0.4"]
hf = ["transformers>=4.40", "safetensors>=0.4"]

[tool.setuptools.packages.find]
include = ["hearthlm*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
